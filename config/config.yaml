        evidence: https://hk.investing.com/news/stock-market-news/article-1256533
    identifier_alias_removals:
      - effective_start: 2023-12-29
        effective_end: 2025-06-29
        alias_instrument: SZ300114
        canonical_instrument: SZ302132
        reason: Qlib 同时保留变更前后代码；Tushare 已把同一上市主体历史权重统一映射为 302132
        evidence: https://disc.static.szse.cn/disc/disk03/finalpage/2025-02-15/cedb693a-f5ee-4463-9682-ea33d406b569.PDF
    synthetic_snapshot_bridges:
      - trade_date: 2021-09-13
        source_instrument: SH601868
        target_instrument: SH600068
        reason: 9月30日锚点已含9月28日后继证券；9月13日合成快照仍应保留当时有效的葛洲坝
        evidence: https://vip.stock.finance.sina.com.cn/corp/go.php/vCI_CorpXiangGuan/stockid/600068.phtml
  expected_fold_count: 8
  main_capital_cny: 10000000
  newey_west_lags:
    - 3
    - 4
    - 5
    - 6
  newey_west_decision_rule: minimum_across_configured_lags
  impact_stress_multiplier: 2.0
  allowed_changes_since_freeze:
    - config/config.yaml
    - src/d9_core.py
    - scripts/d9_pipeline.py
    - scripts/pull_d9_oos.py
    - tests/test_d9_core.py
    - D9运行说明.md
  thresholds:
    annualized_excess_return_min: 0.035
    information_ratio_min: 0.75
    newey_west_t_min: 2.0
    maximum_relative_drawdown_max: 0.10
    specific_contribution_share_min: 0.50
    doubled_impact_annualized_excess_min: 0.0

industry:
  classification: sw_level1
  pit: false
