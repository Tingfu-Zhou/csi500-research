# --- 第3天（续）：价格链修复与修复后 R0 的登记 --------------------------------
# 在看到修复后任何收益数字之前写成。修复的判定规则、锚的选择、不变量与阻断项都在这里冻结；
# 事后如需改动，必须先在 experiment_registry.tsv（D3-05..D3-09）留痕。
day3_price_chain_repair:
  registered_on: "2026-09-09"
  frozen: true
  entry_points:
    evidence: "scripts/d12_collect_factor_evidence.py"
    repair: "scripts/d12_repair_r0.py --stage classify|provider|inputs|r0|compare"
  root_cause:
    security: SZ302132
    breakpoint: "2025-02-24"
    observed_qlib_factor_ratio: 5.975925891558519
    independent_adj_factor_ratio: 1.0
    independent_unadjusted_return: -0.015197568389057725
    evidence_run: "reports/d12/evidence/price_ref_v1"
    statement: >-
      Qlib 的 02-17~02-21 五行按“累计复权因子=1”写入（factor = 1/68.01），02-24 起才带上
      Tushare 的真实 5.976（factor = 5.976/68.01），两段共用同一归一基数。代码变更
      （300114 -> 302132，2025-02-17 启用）之后增量落库未回填前五行，属转换链拼接断裂，
      不是除权除息；两段未复权价都与 Tushare 逐日相符。
  decision_rule:
    verdicts: [factor_consistent, factor_contradicted, no_independent_evidence]
    factor_ratio_tolerance: 1.0e-3      # 与 d12_day3.reference_crosscheck 的筛查阈值一致
    raw_close_tolerance: 1.0e-4
    minimum_independent_coverage: 0.90  # 低于此值拒绝冻结修复计划
    statement: >-
      真实除权日与坏拼接在筛查里同形。唯一判据是同证券同两个交易日的独立复权因子；
      拿不到就是 no_independent_evidence，永远不记作一致。
  method:
    shape: "piecewise-constant multiplier on $factor"
    anchor: earliest
    anchor_reason: >-
      D9 的 assert_design_weight_parity 以 rtol=1e-12 复核冻结设计期权重，float32 只有
      乘数恰为 1.0 才能逐位往返；锚取 earliest 使第一个断点之前的历史一位不动。
    max_multiplier: 1.0e6
    scaled_fields: [open, high, low, close, vwap, factor]
    inverse_fields: [volume]
    invariant_fields: [amount, daily_amount_cny, up_limit, down_limit]
    invariants:
      - "close/factor（未复权价）逐值不变"
      - "volume*factor（未复权股数）逐值不变"
      - "被证据否定的因子比值修正后精确等于独立比值"
      - "原本与证据一致的比值一个都不被改动"
    refuses:
      - "未复权价与独立源不一致的证券（乘子表达不了这类缺陷）"
      - "断点落在设计期内（需另行决定是否重建 D2 设计期缓存）"
      - "乘数超出 1e-6 ~ 1e6"
  cache_invalidation:
    corrected_provider: "data/d12_repair/<repair-id>/provider"     # 与注册 bundle 并存，硬链接未改文件
    rebuilt: [benchmark_weights, tradability_flags]
    rebuilt_by: "scripts/d9_pipeline.build_full_benchmark_weights / build_oos_tradability"
    invalidated: "d11_v1 的全部预测、模型与模拟产物；由 d11_pipeline.run_research 原函数重建"
    unchanged: "reports/d11/d11_v1、reports/d11/d11_diagnostic_v1、注册 provider、140 个受保护文件"
  repaired_r0:
    run_id_default: r0_fixed_v1
    code_path: "scripts/d11_pipeline.py::run_research（原函数，未改）"
    only_difference: "access 指向修正 provider；data.processed_design_dir 与 d9.v2.processed_oos_dir 指向重建缓存"
    comparison_baseline: d11_v1
  not_repaired:
    membership_effective_dates:
      finding: [P0-12, P0-23]
      status: blocked_no_official_full_set_evidence
      reason: >-
        外部查找时限（方案 §4.1）已过，仍无按生效日给出完整 500 名单与权重的官方证据；
        proxy 表是后见代理，不能用于重建。且一次只改一个机制，两次运行的差异才可归属。
  statement: >-
    修复后的 R0 是“价格链可信”的 R0，不是“全部 P0 已关闭”的 R0；它仍带着一个已披露、
    未修复的 A 类成分时点问题。修复是数据订正，不是策略改进：收益升降都如实报告，
    历史 No-Go 不变，归因质量仍为未通过，第四天的 R1 零系数全期门仍是独立必过项。

  # --- 2026-09-09 修订：第一版分类器判据不成立 ---------------------------------
  revision_2026_09_09:
    supersedes: "decision_rule.factor_ratio_tolerance = 1.0e-3（单日比值判定）"
    why: >-
      repair_v1 的 classify 退出码为 0，却产出 29,529 行“矛盾”、501 只、30,030 段、
      4,956 个设计期断点。其中 83.9% 落在 0.1%~0.2%、14.2% 落在 0.2%~0.5%，紧贴阈值堆积——
      阈值切过噪声的形状。SH600017 的 $factor 在三个被标记日都回到同一个 0.488968402，
      SH600021 下跳 0.11% 六周后又回来：因子围绕一个水平抖动并回归，不是台阶。
      而修复模型是分段常数，只能表达持久的水平位移。
    new_decision_rule:
      quantity: "scale(t) = factor(t) / independent_factor(t)"
      screen_tol: 5.0e-3          # 只筛候选，不作判定
      confirm_tol: 5.0e-3         # 两侧中位数水平必须真的位移
      level_window: 5             # 每侧至多 5 个观测
      min_level_observations: 3   # 被已确认断点压短的一侧低于此值不予确认
      max_break_share: 0.02       # 长序列的模型拟合闸门
      settle_order: "按候选自身单日跳变强度由大到小；窗口只在已确认断点处截断"
      new_verdict: factor_noise_not_persistent
    correction_unchanged: >-
      检测与修正是两个问题。检测必须稳健（中位数），修正的目标是已知的（独立比值），
      所以乘数仍取 independent_ratio / observed_ratio，SZ302132 的 2025-02-24 依旧精确回到 -1.5198%。
      verify_repair 在 1e-12 上门控断点比值与段内比值，残余水平错配只报告不门控。
    new_gate:
      flag: "--minimum-separation"
      default: 3.0
      rule: "最小已确认断点必须至少是本次实测单日抖动 p99.99 的 3 倍，否则拒绝冻结计划"
      rationale: >-
        repair_v1 真正缺的不是更好的阈值，而是没有任何东西告诉你结果不成立。
        由运行自己测量噪声底并与最小确认断点比较，不需要事先拍一个数。
    evidence: "reports/d12/repair/repair_v1/classify/（保留为失败证据，不得删除或复用该 run-id）"
